name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Barre de statut et retour
        run: |
          mkdir -p android/app/src/main/res/values
          sed -i 's/<item name="android:background">@null<\/item>/<item name="android:background">@null<\/item><item name="android:statusBarColor">#7a3b1d<\/item>/' android/app/src/main/res/values/styles.xml || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pratiques-islam-zikr-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
